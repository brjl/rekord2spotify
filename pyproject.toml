[project]
name = "rekord2spotify"
version = "0.1.0"
description = "Export rekordbox USB history as tracklists or Spotify playlists"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "spotipy>=2.23",
    "python-dotenv>=1.0",
]

[project.scripts]
rekord2spotify = "rekord2spotify.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"